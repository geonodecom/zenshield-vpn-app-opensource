name: zenshield
description: "Free VPN"
publish_to: "none"
version: 1.0.5+7

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cached_network_image: ^3.4.1
  country_picker: ^2.0.27
  cupertino_icons: ^1.0.2
  device_info_plus: ^11.2.0
  dio: ^5.4.0
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.0
  easy_localization: ^3.0.0
  event_bus: ^2.0.1
  flutter_bloc: ^8.1.6
  flutter_platform_alert: ^0.6.1
  flutter_secure_storage: 10.0.0-beta.5
  flutter_switch: ^0.3.2
  fluttertoast: ^8.2.10
  freezed_annotation: ^2.4.4
  get_it: ^8.0.2
  injectable: ^2.5.0
  json_annotation: ^4.9.0
  modal_bottom_sheet: ^3.0.0
  package_info_plus: ^8.3.0
  permission_handler: ^11.3.1
  launch_at_startup: ^0.5.1
  shared_preferences: ^2.3.2
  side_effect_bloc: ^1.0.0
  talker_bloc_logger: ^4.6.0
  talker_dio_logger: ^4.6.0
  talker_flutter: ^4.6.0
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  quick_actions: ^1.1.0
  share_plus: ^10.1.4
  very_good_analysis: ^7.0.0
  responsive_framework: ^1.5.1
  flutter_native_splash: ^2.4.4
  collection: ^1.19.0
  shimmer: ^3.0.0
  connectivity_plus: ^6.1.3
  path_provider: ^2.1.5
  ffi: ^2.1.3
  window_manager: ^0.4.3
  encrypt: ^5.0.3
  win32_registry: ^2.1.0
  intl: ^0.20.2
  flutter_inappwebview: ^6.1.5
  firebase_core: ^3.13.0
  firebase_crashlytics: ^4.3.4
  ambilytics: ^1.1.0
  desktop_updater:
    path: packages/desktop_updater #Timeout values in the packages\desktop_updater\windows\desktop_updater_plugin.cpp file during updates on Windows have been increased; otherwise, update issues could occur.
  flutter_markdown_plus: 1.0.7
  app_links: ^6.4.1
  webview_flutter: ^4.10.0
  webview_windows: ^0.4.0
  android_intent_plus: ^6.0.0

dev_dependencies:
  flutter_lints: ^5.0.0
  device_preview: ^1.2.0
  build_runner: ^2.4.12
  flutter_gen_runner: ^5.8.0
  injectable_generator: ^2.6.2
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  dart_code_linter: ^3.1.1
  ffigen: ^20.1.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/
    - assets/images/
    - assets/json/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter_18pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter/Inter_18pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter/Inter_18pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter/Inter_18pt-Black.ttf
          weight: 900

    - family: Lato
      fonts:
        - asset: assets/fonts/Lato/Lato-Regular.ttf
          weight: 400
        - asset: assets/fonts/Lato/Lato-Bold.ttf
          weight: 700

    - family: Nunito Sans
      fonts:
        - asset: assets/fonts/Nunito_Sans/NunitoSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito_Sans/NunitoSans-Regular.ttf
          weight: 500
        - asset: assets/fonts/Nunito_Sans/NunitoSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito_Sans/NunitoSans-Bold.ttf
          weight: 700

    - family: Hellix
      fonts:
        - asset: assets/fonts/Hellix/Hellix-Bold.ttf
          weight: 700
        - asset: assets/fonts/Hellix/Hellix-ExtraBold.ttf
          weight: 800

    - family: Helvetica Neue
      fonts:
        - asset: assets/fonts/Helvetica_Neue/HelveticaNeue-Roman.otf
          weight: 400
        - asset: assets/fonts/Helvetica_Neue/HelveticaNeue-Bold.otf
          weight: 700

    - family: SF Pro Text
      fonts:
        - asset: assets/fonts/SF_Pro/SF-Pro-Text-Semibold.otf
          weight: 600
